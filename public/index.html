<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار هوش مصنوعی من</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Vazirmatn', Arial, sans-serif;
      background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0f172a 45%, #020617 100%);
      color: #f1f5f9;
      min-height: 100vh;
    }

    .container {
      width: min(760px, 94%);
      margin: 32px auto;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    header .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.6);
    }

    header p {
      color: #94a3b8;
      margin-top: 10px;
      font-size: 14px;
    }

    #chat {
      height: 65vh;
      min-height: 380px;
      overflow-y: auto;
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 22px;
      border: 1px solid #1f2937;
      box-shadow: 0 20px 45px -20px rgba(0,0,0,0.6);
    }

    #chat::-webkit-scrollbar {
      width: 6px;
    }
    #chat::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      margin: 14px 0;
      align-items: flex-end;
      animation: fadeIn 0.25s ease;
    }

    .row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .row.user .avatar {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .row.assistant .avatar {
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
    }

    .message {
      max-width: 78%;
      padding: 13px 17px;
      border-radius: 16px;
      line-height: 1.9;
      white-space: pre-wrap;
      font-size: 15px;
    }

    .row.user .message {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-bottom-left-radius: 4px;
    }

    .row.assistant .message {
      background: #1f2937;
      border: 1px solid #334155;
      border-bottom-right-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 58px;
      border: 1px solid #334155;
      outline: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 15px;
      font-family: inherit;
      background: #111827;
      color: white;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    button {
      width: 96px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      opacity: 0.6;
    }

    .dots::after {
      content: '...';
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="badge">🤖 دستیار هوش مصنوعی من</div>
      <p>پیامت را بنویس، همین‌جا با هوش مصنوعی چت کن</p>
    </header>

    <div id="chat"></div>

    <div class="input-area">
      <textarea id="message" placeholder="پیامت را بنویس..."></textarea>
      <button id="send">ارسال</button>
    </div>

  </div>

  <script>
    const chat = document.getElementById("chat");
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");

    function addMessage(text, type) {
      const row = document.createElement("div");
      row.className = `row ${type}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = type === "user" ? "🧑" : "🤖";

      const bubble = document.createElement("div");
      bubble.className = "message";
      bubble.textContent = text;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;

      return bubble;
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      messageInput.value = "";
      sendButton.disabled = true;

      const loading = addMessage("در حال فکر کردن", "assistant");
      loading.classList.add("loading", "dots");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            typeof data.error === "string" ? data.error : JSON.stringify(data.error)
          );
        }

        loading.textContent = data.answer || "پاسخی دریافت نشد.";
        loading.classList.remove("loading", "dots");

      } catch (error) {
        loading.textContent = "❌ خطا: " + error.message;
        loading.classList.remove("loading", "dots");

      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
